name: Build APK

# Roda sozinho a cada push na branch main, e também pode ser disparado
# manualmente em: aba Actions → Build APK → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o projeto Android nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Compilar o APK de release (somente arm64, a maioria dos celulares atuais)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-pastoral-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
